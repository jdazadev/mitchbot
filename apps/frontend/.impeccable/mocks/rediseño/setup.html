<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Puesta en mesa · Mesa de Exposición</title>
<link rel="stylesheet" href="style.css">
<style>.wrap{min-height:100vh;display:grid;place-items:center;background:var(--paper)}.box{width:min(680px,94vw)}</style></head><body>
<div class="wrap"><div class="box">
<div class="cond" style="margin-bottom:14px">PUESTA EN MESA · PASO 2 DE 3</div>
<div style="display:flex;gap:6px;margin-bottom:18px">
<div style="flex:1;height:5px;background:var(--ink)"></div>
<div style="flex:1;height:5px;background:var(--magenta)"></div>
<div style="flex:1;height:5px;background:var(--hair)"></div></div>
<div class="calco">
<div class="ph"><h2>El agente del negocio</h2><span class="sub">PASO 2 · 3</span></div>
<div style="padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div class="fld"><label>SU NOMBRE</label><input style="background:#FFF;border:1.5px solid var(--ink);padding:10px 13px" value="Martina"></div>
<div class="fld"><label>ROL</label><input style="background:#FFF;border:1.5px solid var(--ink);padding:10px 13px" value="Atención de matrícula del taller"></div>
<div class="fld" style="grid-column:1 / -1"><label>SU FORMA (PERSONALIDAD)</label><input style="background:#FFF;border:1.5px solid var(--ink);padding:10px 13px" value="Cercana: como tu compi del gremio, técnica y sin jerga"></div>
<div class="fld"><label>IDIOMA</label><select style="background:#FFF;border:1.5px solid var(--ink);padding:10px 13px"><option>Español</option><option>Inglés</option></select></div>
<div class="fld"><label>EMOJIS</label><select style="background:#FFF;border:1.5px solid var(--ink);padding:10px 13px"><option>Pocos, con intención</option></select></div>
</div>
<div style="border-top:2px solid var(--ink);padding:12px 18px;display:flex;gap:10px">
<button class="btn" style="margin-left:auto">← PASO 1 · PROYECTO</button>
<a class="btn fill" href="dashboard.html">SIGUIENTE: CANALES →</a></div></div>
<div class="cond" style="margin-top:16px;text-align:center">PASO 3 CONECTA LOS CANALES Y CIERRA LA MESA</div>
</div></div>
</body></html>
