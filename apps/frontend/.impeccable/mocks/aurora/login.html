<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitchbot · Aurora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,500;12..96,75..100,600;12..96,75..100,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>body{overflow-x:hidden}</style></head><body><div class="haze" aria-hidden="true"></div><div style="min-height:100vh;display:grid;place-items:center;padding:30px;position:relative;z-index:1"><div style="width:min(460px,94vw)"><div style="display:flex;align-items:center;gap:12px;margin-bottom:22px"><div style="width:44px;height:44px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px">M</div><div style="font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em">Mitchbot</div></div><div class="card pad" style="padding:34px 32px;border-radius:var(--r-big);box-shadow:var(--shadow-lift)"><h1 style="font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.035em;line-height:1">Hola otra vez.<br>Entra al panel.</h1><div class="note" style="margin:10px 0 24px">Inicia sesión en tu cuenta.</div><div class="field"><label>Correo</label><input value="jorge@estudiomateo.io" placeholder="tu@email.com"></div><div class="field" style="margin-top:14px"><label>Contraseña</label><input type="password" value="no-importa" placeholder="••••••••"></div><button class="btn" style="width:100%;justify-content:center;padding:13px;margin-top:20px">Iniciar Sesión</button><div style="display:flex;gap:8px;margin-top:20px;justify-content:center;flex-wrap:wrap"><span class="pill sky"><span class="d"></span>Sin tarjeta</span><span class="pill lime"><span class="d"></span>Listo en minutos</span><span class="pill lilac"><span class="d"></span>Tus datos, cifrados</span></div></div><div class="note" style="text-align:center;margin-top:18px">Las cuentas se crean desde el equipo, no desde aquí.</div></div></div></body></html>
